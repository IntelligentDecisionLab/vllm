[project]
name = "vllm-inference-service"
version = "0.1.0"
description = "Multi-model OpenAI-compatible gateway for independent vLLM backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "huggingface-hub>=0.30",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# vLLM has hardware/CUDA-specific installation choices.  Keep it optional so
# the gateway can be inspected and tested on a CPU-only machine, while the
# normal GPU install remains: `uv sync --extra runtime`.
runtime = [
    "vllm==0.27.1",
]
test = ["pytest>=8.0"]

[project.scripts]
vllm-service = "sglang_service.cli:main"
vllm-gateway = "sglang_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sglang_service"]

[tool.hatch.build.targets.wheel.force-include]
"models.toml" = "models.toml"
