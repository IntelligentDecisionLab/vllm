# vLLM Model Catalog Configuration
# Native Transformers / Safetensors FP8 models

[default]
context_length = 262144
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 1
data_parallel_size = 1
mem_fraction_static = 0.45
max_num_seqs = 16
max_num_batched_tokens = 2048
idle_seconds = 1800
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
attention_backend = "flashinfer"
vllm_args = [
    "--enable-chunked-prefill",
    "--enable-prefix-caching",
    "--enable-flashinfer-autotune",
    "--async-scheduling",
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 2}',
]

# --- 1. Local Coding Agent 專用 (27B 使用雙 GPU) ---
["qwen3.8-27b"]
model_path = "Qwen/Qwen3.8-27B-FP8"
context_length = 262144
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 2
data_parallel_size = 1
mem_fraction_static = 0.35
max_num_seqs = 64
idle_seconds = 0.0
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
default = true
aliases = ["qwen3.8-27b-fp8"]
vllm_args = [
    "--enable-chunked-prefill",
    "--enable-prefix-caching",
    "--enable-flashinfer-autotune",
    "--async-scheduling",
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 3}',
]

# --- 2. 批次實驗專用 (9B 使用 GPU 1，與 27B 共用) ---
["qwen3.5-9b"]
model_path = "Qwen/Qwen3.5-9B"
context_length = 131072
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 1
data_parallel_size = 1
mem_fraction_static = 0.35          # GPU 1 使用總記憶體的 35%；與 27B 及外部程序共用
max_num_seqs = 128
idle_seconds = 0.0
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
aliases = ["qwen3.5-9b"]
vllm_args = [
    "--device-ids", "1",            # 鎖定 GPU 1，與 Coding Agent 物理隔離
    "--enable-chunked-prefill",
    "--enable-prefix-caching",
    "--enable-flashinfer-autotune",
    "--async-scheduling",
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 2}',
]
