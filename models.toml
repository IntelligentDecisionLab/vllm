# vLLM Model Catalog Configuration
# Native Transformers / Safetensors FP8 models

[default]
context_length = 262144
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 1
data_parallel_size = 1
gpu_memory_utilization = 0.45
max_num_seqs = 16
max_num_batched_tokens = 2048
idle_seconds = 1800
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
attention_backend = "flashinfer"
async_scheduling = true
flashinfer_autotune = true
enable_prefix_caching = true
# speculative (MTP) 改為 per-model 宣告：pooling/convert backend 不得繼承
# （TOML 無法清除繼承值，manager 無負向 flag，見 manager.py 的 --speculative-config 生成邏輯）

# --- 1. Local Coding Agent 專用 (27B 使用雙 GPU) ---
["qwen3.8-27b"]
model_path = "Qwen/Qwen3.8-27B-FP8"
context_length = 262144
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 4
data_parallel_size = 1
gpu_memory_utilization = 0.20
max_num_seqs = 64
idle_seconds = 0.0
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
default = true
aliases = ["qwen3.8-27b-fp8"]
attention_backend = "flashinfer"
speculative_method = "mtp"
num_speculative_tokens = 2

# --- 2a. openjev 4B NLI (pooling/classify backend，AlexWortega/openjev qwen3.5-4b-nli-v2) ---
# 注意：pooling backend 只提供 /v1/classify，無 chat/completions；
# 不設 speculative_method（TOML 無法清除繼承值，見上方註解）
["openjev-4b"]
model_path = "/home/sam/local/models/openjev-4b-v2-text"
gpu_memory_utilization = 0.15    # 9GB bf16 權重 + 小型 KV；與 27B/9B 共用 GPU 1
device_ids = [1]
aliases = ["openjev"]
vllm_args = ["--convert", "classify"]

# --- 2. 批次實驗專用 (9B 使用 GPU 1，與 27B 共用) ---
["qwen3.5-9b"]
model_path = "Qwen/Qwen3.5-9B"
context_length = 131072
kv_cache_dtype = "fp8_e4m3"
tensor_parallel_size = 1
data_parallel_size = 1
gpu_memory_utilization = 0.35          # GPU 1 使用總記憶體的 35%；與 27B 及外部程序共用
max_num_seqs = 128
idle_seconds = 0.0
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_coder"
aliases = ["qwen3.5-9b"]
device_ids = [1]
speculative_method = "mtp"
num_speculative_tokens = 2
